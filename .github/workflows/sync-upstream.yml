name: Sync Upstream Skills

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-yomiyasu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync skills/yomiyasu from upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add up https://github.com/nanaism/yomiyasu.git
          git fetch --depth 1 up main
          rm -rf skills/yomiyasu
          git checkout up/main -- skills/yomiyasu
          git add -A skills/yomiyasu
          if git diff --cached --quiet; then
            echo "No changes from upstream."
            exit 0
          fi
          git commit -m "chore: sync yomiyasu from upstream"
          git push
